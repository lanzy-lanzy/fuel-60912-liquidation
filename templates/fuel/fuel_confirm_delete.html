{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-4">Confirm Delete</h2>
    <p class="mb-6">Are you sure you want to delete this fuel entry?</p>
    
    <div class="bg-red-50 p-4 rounded-lg mb-6">
        <p class="text-red-600">
            <strong>{{ object.driver }}</strong> - {{ object.date }}<br>
            {{ object.total_liters }}L (₱{{ object.cost }})
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="flex justify-end space-x-3">
            <a href="{% url 'dashboard' %}" 
               class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">Cancel</a>
            <button type="submit" 
                    class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                Confirm Delete
            </button>
        </div>
    </form>
</div>
{% endblock %}
