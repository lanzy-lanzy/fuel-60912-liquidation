{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-red-200 bg-white p-6 shadow-soft">
    <h1 class="text-lg font-black">Delete RER {{ object.rer_no|default:object.pk }}?</h1>
    <p class="text-sm text-slate-600 mt-1">Attached image will also be removed from storage.</p>
    <form method="post" class="mt-6 flex justify-end gap-2">{% csrf_token %}
        <a href="{% url 'rer_list' %}" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold">Cancel</a>
        <button type="submit" class="rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white">Delete</button>
    </form>
</div>
{% endblock %}
