<!DOCTYPE html>
<html lang="en">
{% load custom_filters %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="text-2xl font-bold">FuelTrack</a>
            <div class="space-x-4">
                <a href="{% url 'dashboard' %}" class="hover:text-blue-200">Dashboard</a>
                <a href="{% url 'driver_list' %}" class="hover:text-blue-200">Drivers</a>
                <a href="{% url 'fuel_report' %}" class="hover:text-blue-200">Reports</a>
                <a href="{% url 'fuelconsumption_create' %}" class="bg-green-500 px-3 py-2 rounded hover:bg-green-600">New Entry</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
